name: Build phpIPAM (OceanBase-compat) images

# Overlays the LockForUpdate OceanBase fix onto the official phpipam-www / -cron images
# and pushes to GHCR. Manual (workflow_dispatch) or on push to the fix branch.
on:
  workflow_dispatch:
    inputs:
      phpipam_version:
        description: "Upstream phpIPAM image tag to overlay"
        default: "v1.8.1"
  push:
    branches: [ "fix/oceanbase-lock-timeout" ]
    paths:
      - "functions/classes/class.LockForUpdate.php"
      - "docker/oceanbase/**"
      - ".github/workflows/build-oceanbase.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [ www, cron ]
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: echo "PHPIPAM_VERSION=${{ github.event.inputs.phpipam_version || 'v1.8.1' }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push ${{ matrix.variant }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/oceanbase/Dockerfile
          build-args: |
            BASE=phpipam/phpipam-${{ matrix.variant }}:${{ env.PHPIPAM_VERSION }}
          push: true
          tags: |
            ghcr.io/aagarwal-apexanalytix/phpipam-${{ matrix.variant }}:${{ env.PHPIPAM_VERSION }}-ob
            ghcr.io/aagarwal-apexanalytix/phpipam-${{ matrix.variant }}:${{ env.PHPIPAM_VERSION }}-ob.${{ github.run_number }}
